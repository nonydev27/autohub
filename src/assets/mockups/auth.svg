<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>AutoHub — Auth page (src/pages/Auth.jsx)</title>
  <rect width="1280" height="800" fill="#f1f5f9"/>

  <!-- card -->
  <rect x="452" y="140" width="376" height="520" rx="20" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="452" y="146" width="376" height="520" rx="20" fill="#0f172a" opacity="0.04"/>
  <rect x="452" y="140" width="376" height="520" rx="20" fill="#ffffff"/>

  <!-- logo -->
  <rect x="612" y="180" width="56" height="56" rx="14" fill="#f97316"/>
  <g fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M624 216 h32 v-8 l-5 -9 h-22 l-5 9 z"/>
    <circle cx="631" cy="218" r="3.5" fill="#fff"/><circle cx="649" cy="218" r="3.5" fill="#fff"/>
  </g>
  <text x="640" y="272" text-anchor="middle" font-size="28" font-weight="700" fill="#0f172a">AutoHub</text>
  <text x="640" y="298" text-anchor="middle" font-size="14" fill="#64748b">Connect, chat &amp; catch up on auto news</text>

  <!-- email -->
  <text x="484" y="340" font-size="13" font-weight="600" fill="#334155">Email</text>
  <rect x="484" y="350" width="312" height="44" rx="10" fill="#fff" stroke="#cbd5e1"/>
  <text x="498" y="377" font-size="14" fill="#94a3b8">you@example.com</text>

  <!-- password -->
  <text x="484" y="422" font-size="13" font-weight="600" fill="#334155">Password</text>
  <rect x="484" y="432" width="312" height="44" rx="10" fill="#fff" stroke="#f97316" stroke-width="2"/>
  <text x="498" y="460" font-size="16" fill="#0f172a" letter-spacing="3">••••••••</text>

  <!-- error -->
  <text x="484" y="500" font-size="13" fill="#dc2626">Invalid login credentials</text>

  <!-- button -->
  <rect x="484" y="516" width="312" height="46" rx="10" fill="#f97316"/>
  <text x="640" y="545" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">Log In</text>

  <!-- toggle -->
  <text x="640" y="610" text-anchor="middle" font-size="13" fill="#64748b">Don't have an account? <tspan fill="#ea580c" font-weight="600">Sign up</tspan></text>

  <!-- annotations -->
  <g font-size="12" fill="#7c3aed">
    <text x="860" y="210">← orange square + &lt;Car /&gt; icon</text>
    <text x="860" y="378">← &lt;input type="email" required&gt;</text>
    <text x="860" y="459">← focus: border-orange-500</text>
    <text x="860" y="500">← only when error state is set</text>
    <text x="860" y="544">← disabled + "Please wait..." while loading</text>
    <text x="860" y="610">← toggles isSignUp (button text becomes "Sign Up")</text>
    <text x="40" y="60" font-size="14" font-weight="700">Auth.jsx — /auth</text>
    <text x="40" y="82">card: max-w-sm rounded-2xl bg-white p-8 shadow-lg, centred on bg-slate-100</text>
  </g>
</svg>
