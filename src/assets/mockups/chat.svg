<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>AutoHub — Chat page (Navbar.jsx + ChatRoom.jsx + MessageBubble.jsx)</title>
  <rect width="1280" height="800" fill="#f1f5f9"/>

  <!-- NAVBAR -->
  <rect width="1280" height="64" fill="#ffffff"/>
  <rect y="63" width="1280" height="1" fill="#e2e8f0"/>
  <rect x="24" y="16" width="32" height="32" rx="8" fill="#f97316"/>
  <g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M31 37 h18 v-5 l-3 -5 h-12 l-3 5 z"/><circle cx="35" cy="38" r="2" fill="#fff"/><circle cx="45" cy="38" r="2" fill="#fff"/>
  </g>
  <text x="66" y="38" font-size="18" font-weight="700" fill="#0f172a">AutoHub</text>

  <rect x="548" y="14" width="88" height="36" rx="8" fill="#fff7ed"/>
  <circle cx="570" cy="32" r="7" fill="none" stroke="#ea580c" stroke-width="2"/>
  <text x="584" y="37" font-size="14" font-weight="600" fill="#ea580c">Chat</text>
  <rect x="660" y="23" width="14" height="16" rx="2" fill="none" stroke="#475569" stroke-width="2"/>
  <text x="682" y="37" font-size="14" fill="#475569">News</text>

  <text x="1080" y="37" text-anchor="end" font-size="13" fill="#64748b">karl@autohub.dev</text>
  <rect x="1096" y="14" width="160" height="36" rx="8" fill="#fff" stroke="#e2e8f0"/>
  <path d="M1116 26 v12 M1116 32 h10 M1122 28 l4 4 -4 4" stroke="#475569" stroke-width="2" fill="none" stroke-linecap="round"/>
  <text x="1136" y="37" font-size="14" fill="#475569">Logout</text>

  <!-- CHAT CONTAINER -->
  <rect x="256" y="88" width="768" height="60" rx="12" fill="#fff"/>
  <text x="280" y="124" font-size="20" font-weight="700" fill="#0f172a">Community Chat</text>
  <circle cx="944" cy="118" r="5" fill="#22c55e"/>
  <text x="956" y="123" font-size="13" fill="#16a34a">Live</text>

  <rect x="256" y="160" width="768" height="540" rx="12" fill="#fff"/>

  <!-- other msg 1 -->
  <text x="280" y="192" font-size="12" fill="#64748b">kwame · 13:58</text>
  <rect x="280" y="200" width="360" height="44" rx="18" fill="#e2e8f0"/>
  <text x="298" y="227" font-size="14" fill="#0f172a">Anyone know why my Corolla idles rough?</text>

  <!-- own msg 1 -->
  <text x="1000" y="276" text-anchor="end" font-size="12" fill="#64748b">You · 14:01</text>
  <rect x="610" y="284" width="390" height="64" rx="18" fill="#f97316"/>
  <text x="628" y="310" font-size="14" fill="#fff">Check the spark plugs and the idle air control</text>
  <text x="628" y="332" font-size="14" fill="#fff">valve first — cheap fixes 🔧</text>

  <!-- other msg 2 -->
  <text x="280" y="380" font-size="12" fill="#64748b">ama.mechanic · 14:02</text>
  <rect x="280" y="388" width="420" height="64" rx="18" fill="#e2e8f0"/>
  <text x="298" y="414" font-size="14" fill="#0f172a">Also a vacuum leak. Spray carb cleaner around the</text>
  <text x="298" y="436" font-size="14" fill="#0f172a">intake with the engine running and listen.</text>

  <!-- other msg 3 -->
  <text x="280" y="484" font-size="12" fill="#64748b">kwame · 14:03</text>
  <rect x="280" y="492" width="190" height="44" rx="18" fill="#e2e8f0"/>
  <text x="298" y="519" font-size="14" fill="#0f172a">Thanks guys, will try!</text>

  <!-- own msg 2 -->
  <text x="1000" y="568" text-anchor="end" font-size="12" fill="#64748b">You · 14:04</text>
  <rect x="860" y="576" width="140" height="44" rx="18" fill="#f97316"/>
  <text x="878" y="603" font-size="14" fill="#fff">Let us know 👍</text>

  <!-- INPUT FORM -->
  <rect x="256" y="712" width="700" height="48" rx="12" fill="#fff" stroke="#cbd5e1"/>
  <text x="276" y="741" font-size="14" fill="#94a3b8">Type a message...</text>
  <rect x="968" y="712" width="56" height="48" rx="12" fill="#f97316"/>
  <path d="M986 736 l20 -9 -7 19 -3 -7 z" fill="#fff"/>

  <!-- annotations -->
  <g font-size="12" fill="#7c3aed">
    <text x="24" y="96" font-weight="700" font-size="13">Navbar.jsx ↑</text>
    <text x="24" y="114">h-16 bg-white border-b</text>
    <text x="24" y="132">active NavLink: bg-orange-50</text>
    <text x="24" y="150">text-orange-600</text>

    <text x="24" y="200" font-weight="700" font-size="13">ChatRoom.jsx</text>
    <text x="24" y="218">max-w-3xl mx-auto</text>
    <text x="24" y="236">list: flex-1 overflow-y-auto</text>
    <text x="24" y="254">space-y-3</text>

    <text x="24" y="300" font-weight="700" font-size="13">MessageBubble.jsx</text>
    <text x="24" y="318">others: left, bg-slate-200</text>
    <text x="24" y="336">own: right, bg-orange-500</text>
    <text x="24" y="354">max-w-[75%] rounded-2xl</text>
    <text x="24" y="372">label: name · time (text-xs)</text>

    <text x="24" y="730" font-weight="700" font-size="13">&lt;form&gt; ↗</text>
    <text x="24" y="748">input flex-1 + Send button</text>

    <text x="1044" y="606">← auto-scroll target:</text>
    <text x="1044" y="624">&lt;div ref={bottomRef} /&gt;</text>
    <text x="1044" y="642">sits after the last bubble</text>
    <text x="1044" y="741">← &lt;Send /&gt; icon</text>
  </g>
</svg>
