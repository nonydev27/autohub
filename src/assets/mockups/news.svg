<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>AutoHub — News page (NewsFeed.jsx + NewsCard.jsx)</title>
  <defs>
    <linearGradient id="img" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cbd5e1"/><stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
    <g id="card">
      <rect width="352" height="360" rx="12" fill="#fff"/>
      <path d="M0 12 a12 12 0 0 1 12 -12 h328 a12 12 0 0 1 12 12 v164 h-352 z" fill="url(#img)"/>
      <path d="M130 130 l36 -40 28 30 18 -18 40 28 z" fill="#fff" opacity="0.6"/>
      <circle cx="226" cy="70" r="12" fill="#fff" opacity="0.6"/>
    </g>
  </defs>
  <rect width="1280" height="860" fill="#f1f5f9"/>

  <!-- NAVBAR (News active) -->
  <rect width="1280" height="64" fill="#ffffff"/>
  <rect y="63" width="1280" height="1" fill="#e2e8f0"/>
  <rect x="24" y="16" width="32" height="32" rx="8" fill="#f97316"/>
  <g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M31 37 h18 v-5 l-3 -5 h-12 l-3 5 z"/><circle cx="35" cy="38" r="2" fill="#fff"/><circle cx="45" cy="38" r="2" fill="#fff"/>
  </g>
  <text x="66" y="38" font-size="18" font-weight="700" fill="#0f172a">AutoHub</text>
  <circle cx="570" cy="32" r="7" fill="none" stroke="#475569" stroke-width="2"/>
  <text x="584" y="37" font-size="14" fill="#475569">Chat</text>
  <rect x="648" y="14" width="92" height="36" rx="8" fill="#fff7ed"/>
  <rect x="660" y="23" width="14" height="16" rx="2" fill="none" stroke="#ea580c" stroke-width="2"/>
  <text x="682" y="37" font-size="14" font-weight="600" fill="#ea580c">News</text>
  <text x="1080" y="37" text-anchor="end" font-size="13" fill="#64748b">karl@autohub.dev</text>
  <rect x="1096" y="14" width="160" height="36" rx="8" fill="#fff" stroke="#e2e8f0"/>
  <path d="M1116 26 v12 M1116 32 h10 M1122 28 l4 4 -4 4" stroke="#475569" stroke-width="2" fill="none" stroke-linecap="round"/>
  <text x="1136" y="37" font-size="14" fill="#475569">Logout</text>

  <!-- HEADER -->
  <rect x="88" y="104" width="22" height="26" rx="3" fill="none" stroke="#f97316" stroke-width="2.5"/>
  <text x="124" y="128" font-size="28" font-weight="700" fill="#0f172a">Today's Auto News</text>
  <text x="88" y="158" font-size="14" fill="#64748b">Sunday, October 18, 2026</text>

  <!-- ROW 1 -->
  <use href="#card" x="88" y="184"/>
  <use href="#card" x="464" y="184"/>
  <use href="#card" x="840" y="184"/>

  <g font-size="16" font-weight="600" fill="#0f172a">
    <text x="104" y="392">5 Signs Your Brake Pads Need</text><text x="104" y="414">Replacing Right Now</text>
    <text x="480" y="392">Toyota Unveils New Hybrid Engine</text><text x="480" y="414">With 40% Better Efficiency</text>
    <text x="856" y="392">EV Battery Repair: What Every</text><text x="856" y="414">Mechanic Should Know in 2026</text>
  </g>
  <g font-size="13" fill="#64748b">
    <text x="104" y="442">Squealing, grinding and a soft pedal are</text><text x="104" y="462">warning signs you shouldn't ignore…</text>
    <text x="480" y="442">The new powertrain arrives in showrooms</text><text x="480" y="462">next spring across most models…</text>
    <text x="856" y="442">High-voltage safety, diagnostics tools and</text><text x="856" y="462">the training you'll need to stay ahead…</text>
  </g>
  <g font-size="12">
    <text x="104" y="524" fill="#94a3b8">MotorTrend · Oct 18</text><text x="424" y="524" text-anchor="end" font-weight="600" fill="#ea580c">Read more →</text>
    <text x="480" y="524" fill="#94a3b8">Autocar · Oct 18</text><text x="800" y="524" text-anchor="end" font-weight="600" fill="#ea580c">Read more →</text>
    <text x="856" y="524" fill="#94a3b8">Car and Driver · Oct 17</text><text x="1176" y="524" text-anchor="end" font-weight="600" fill="#ea580c">Read more →</text>
  </g>

  <!-- ROW 2 (cut off) -->
  <use href="#card" x="88" y="568"/>
  <use href="#card" x="464" y="568"/>
  <use href="#card" x="840" y="568"/>
  <rect x="0" y="800" width="1280" height="60" fill="#f1f5f9" opacity="0.85"/>

  <!-- annotations -->
  <g font-size="12" fill="#7c3aed">
    <text x="760" y="114" font-weight="700" font-size="13">NewsFeed.jsx</text>
    <text x="760" y="132">main: max-w-6xl mx-auto p-6</text>
    <text x="760" y="150">grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6</text>
    <text x="1200" y="270" font-weight="700" font-size="13">NewsCard</text>
    <text x="1200" y="288">image:</text>
    <text x="1200" y="304">h-44</text>
    <text x="1200" y="320">object-cover</text>
    <text x="1200" y="400">title:</text>
    <text x="1200" y="416">line-clamp-2</text>
    <text x="1200" y="448">desc:</text>
    <text x="1200" y="464">line-clamp-3</text>
    <text x="1200" y="508">footer:</text>
    <text x="1200" y="524">mt-auto</text>
    <text x="88" y="840" font-size="13">Loading state: "Loading news..."  ·  Error state: red text + "Try again" button</text>
  </g>
</svg>
