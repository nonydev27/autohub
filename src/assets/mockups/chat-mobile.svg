<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>AutoHub — Chat on mobile (390px wide)</title>
  <rect width="390" height="844" rx="36" fill="#f1f5f9"/>

  <!-- navbar: email hidden, labels kept short -->
  <path d="M0 36 a36 36 0 0 1 36 -36 h318 a36 36 0 0 1 36 36 v28 h-390 z" fill="#fff"/>
  <rect y="64" width="390" height="1" fill="#e2e8f0"/>
  <rect x="16" y="16" width="32" height="32" rx="8" fill="#f97316"/>
  <g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M23 37 h18 v-5 l-3 -5 h-12 l-3 5 z"/><circle cx="27" cy="38" r="2" fill="#fff"/><circle cx="37" cy="38" r="2" fill="#fff"/>
  </g>
  <rect x="190" y="14" width="68" height="36" rx="8" fill="#fff7ed"/>
  <text x="224" y="37" text-anchor="middle" font-size="13" font-weight="600" fill="#ea580c">Chat</text>
  <text x="290" y="37" text-anchor="middle" font-size="13" fill="#475569">News</text>
  <rect x="330" y="14" width="44" height="36" rx="8" fill="#fff" stroke="#e2e8f0"/>
  <path d="M344 26 v12 M344 32 h10 M350 28 l4 4 -4 4" stroke="#475569" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- header -->
  <rect x="12" y="80" width="366" height="48" rx="12" fill="#fff"/>
  <text x="28" y="110" font-size="17" font-weight="700" fill="#0f172a">Community Chat</text>
  <circle cx="320" cy="104" r="4" fill="#22c55e"/><text x="330" y="109" font-size="12" fill="#16a34a">Live</text>

  <!-- list -->
  <rect x="12" y="140" width="366" height="610" rx="12" fill="#fff"/>
  <text x="28" y="170" font-size="11" fill="#64748b">kwame · 13:58</text>
  <rect x="28" y="178" width="260" height="60" rx="18" fill="#e2e8f0"/>
  <text x="44" y="203" font-size="13" fill="#0f172a">Anyone know why my</text>
  <text x="44" y="223" font-size="13" fill="#0f172a">Corolla idles rough?</text>

  <text x="362" y="268" text-anchor="end" font-size="11" fill="#64748b">You · 14:01</text>
  <rect x="102" y="276" width="260" height="80" rx="18" fill="#f97316"/>
  <text x="118" y="301" font-size="13" fill="#fff">Check the spark plugs and</text>
  <text x="118" y="321" font-size="13" fill="#fff">the idle air control valve</text>
  <text x="118" y="341" font-size="13" fill="#fff">first — cheap fixes 🔧</text>

  <text x="28" y="386" font-size="11" fill="#64748b">ama.mechanic · 14:02</text>
  <rect x="28" y="394" width="270" height="60" rx="18" fill="#e2e8f0"/>
  <text x="44" y="419" font-size="13" fill="#0f172a">Also a vacuum leak. Spray</text>
  <text x="44" y="439" font-size="13" fill="#0f172a">carb cleaner on the intake.</text>

  <text x="362" y="484" text-anchor="end" font-size="11" fill="#64748b">You · 14:04</text>
  <rect x="232" y="492" width="130" height="40" rx="18" fill="#f97316"/>
  <text x="248" y="517" font-size="13" fill="#fff">Let us know 👍</text>

  <!-- form -->
  <rect x="12" y="764" width="300" height="48" rx="12" fill="#fff" stroke="#cbd5e1"/>
  <text x="28" y="793" font-size="14" fill="#94a3b8">Type a message...</text>
  <rect x="322" y="764" width="56" height="48" rx="12" fill="#f97316"/>
  <path d="M340 788 l20 -9 -7 19 -3 -7 z" fill="#fff"/>

  <text x="195" y="836" text-anchor="middle" font-size="11" fill="#7c3aed">email hidden on mobile: "hidden sm:inline"</text>
</svg>
